name: Restore project structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project

          PACKAGE=$(find /tmp/project -name package.json -type f | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "package.json not found inside ZIP"
            exit 1
          fi

          SOURCE=$(dirname "$PACKAGE")
          echo "Project source: $SOURCE"

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          cp -a "$SOURCE"/. .

          rm -f "$ZIP"

      - name: Commit restored project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Restore project directory structure" || echo "No changes to commit"
          git push
